[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-paradox-resolver"
version = "2.0.0"
description = "Archive your decisions, then hold them: a commitment engine that only lets you change course for real reasons."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.35", "google-genai>=0.8.0"]
llm = ["google-genai>=0.8.0"]
dev = ["pytest>=8"]

[project.scripts]
tpr = "temporal_paradox_resolver.cli:main"

[tool.setuptools]
packages = ["temporal_paradox_resolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
